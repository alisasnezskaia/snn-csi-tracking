[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-csi-tracking"
version = "0.1.0"
description = "Spiking neural networks for human activity/tracking from WiFi CSI data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alisa Snezskaia" }]

dependencies = [
    "torch>=2.1",
    "snntorch>=0.9",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "umap-learn>=0.5",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
    "scapy>=2.5",
    "transformers>=4.40",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.4",
    "PyWavelets>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
